plugins { id "com.android.application" }

android {
    namespace "com.ls400.toolbox"
    compileSdk 35

    defaultConfig {
        applicationId "com.ls400.toolbox"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
